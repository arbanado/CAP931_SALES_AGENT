[project]
name = "cap931-sales-agent"
version = "0.1.0"
description = "CAP 931 multi-agent GPT sales assistant prototype for account research, competitor analysis, leadership insights, and one-page sales brief generation."
readme = "README.md"
authors = [
    { name = "Arbana Doda" }
]
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.0.0",
    "pydantic>=2.0.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
